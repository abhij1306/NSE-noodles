[project]
name = "nse-noodles"
version = "0.1.0"
description = "Build a clean, survivorship-bias-free NSE daily dataset from NSE's own free sources"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "polars>=1.10",
    "pyarrow>=16",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
noodles = "nse_noodles.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nse_noodles"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S608", "RUF001", "RUF002", "RUF003", "SIM905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
